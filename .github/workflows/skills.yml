name: Update skills

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días
  workflow_dispatch:
  push:
    paths: ["scripts/skills.mjs"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/skills.mjs
        env:
          GH_USER: EDaniel-B
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/skills.svg
          git diff --staged --quiet || git commit -m "chore: update skills chart"
          git push