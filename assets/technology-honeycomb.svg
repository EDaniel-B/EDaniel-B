
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="850"
     viewBox="0 0 1100 850"
     role="img"
     aria-labelledby="title description">

  <title id="title">Technology Proficiency - Elías Daniel Bone</title>
  <desc id="description">
    Technology skills represented as a honeycomb diagram.
    Each hexagon displays a technology, self-assessed proficiency
    level and usage frequency.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171421"/>
      <stop offset="100%" stop-color="#272035"/>
    </linearGradient>

    <linearGradient id="daily" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6241B5"/>
    </linearGradient>

    <linearGradient id="weekly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65518F"/>
      <stop offset="100%" stop-color="#483A68"/>
    </linearGradient>

    <linearGradient id="monthly" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#454052"/>
      <stop offset="100%" stop-color="#34303F"/>
    </linearGradient>

    <linearGradient id="occasional" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#393542"/>
      <stop offset="100%" stop-color="#292630"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5"
                    flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <style>
      .heading {
        font-family: Arial, Helvetica, sans-serif;
        fill: #F5F0FF;
        font-weight: bold;
      }

      .subtitle {
        font-family: Arial, Helvetica, sans-serif;
        fill: #B9AECF;
        font-size: 13px;
      }

      .technology {
        font-family: Arial, Helvetica, sans-serif;
        fill: #FFFFFF;
        font-size: 15px;
        font-weight: bold;
        text-anchor: middle;
      }

      .level {
        font-family: Arial, Helvetica, sans-serif;
        fill: #E9D5FF;
        font-size: 12px;
        text-anchor: middle;
      }

      .frequency {
        font-family: Arial, Helvetica, sans-serif;
        fill: #D4CBE4;
        font-size: 10px;
        text-anchor: middle;
      }

      .legend {
        font-family: Arial, Helvetica, sans-serif;
        fill: #E7DDF8;
        font-size: 12px;
      }

      .hexagon {
        stroke: #C4B5FD;
        stroke-opacity: 0.35;
        stroke-width: 1.5;
        filter: url(#shadow);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="850" rx="22" fill="url(#background)"/>

  <!-- Header -->
  <text x="550" y="55" text-anchor="middle"
        class="heading" font-size="29">
    TECHNOLOGY PROFICIENCY
  </text>

  <text x="550" y="82" text-anchor="middle" class="subtitle">
    ELÍAS DANIEL BONE · SKILLS &amp; EXPERIENCE
  </text>

  <text x="550" y="105" text-anchor="middle"
        class="subtitle" font-size="11">
    Self-assessed experience and frequency of use
  </text>

  <!-- Row 1 -->
  <g>
    <polygon class="hexagon" fill="url(#daily)"
      points="550,135 615,172 615,246 550,283 485,246 485,172"/>
    <text x="550" y="195" class="technology">C#</text>
    <text x="550" y="218" class="level">Level 2 / 4</text>
    <text x="550" y="237" class="frequency">Daily</text>
  </g>

  <!-- Row 2 -->
  <g>
    <polygon class="hexagon" fill="url(#daily)"
      points="437,200 502,237 502,311 437,348 372,311 372,237"/>
    <text x="437" y="260" class="technology">.NET</text>
    <text x="437" y="283" class="level">Level 1 / 4</text>
    <text x="437" y="302" class="frequency">Daily</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#daily)"
      points="663,200 728,237 728,311 663,348 598,311 598,237"/>
    <text x="663" y="260" class="technology">SQL Server</text>
    <text x="663" y="283" class="level">Level 3 / 4</text>
    <text x="663" y="302" class="frequency">Daily</text>
  </g>

  <!-- Row 3 -->
  <g>
    <polygon class="hexagon" fill="url(#daily)"
      points="324,265 389,302 389,376 324,413 259,376 259,302"/>
    <text x="324" y="325" class="technology">ASP.NET Core</text>
    <text x="324" y="348" class="level">Level 2 / 4</text>
    <text x="324" y="367" class="frequency">Daily</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#daily)"
      points="550,265 615,302 615,376 550,413 485,376 485,302"/>
    <text x="550" y="325" class="technology">SQL</text>
    <text x="550" y="348" class="level">Level 4 / 4</text>
    <text x="550" y="367" class="frequency">Daily</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#daily)"
      points="776,265 841,302 841,376 776,413 711,376 711,302"/>
    <text x="776" y="325" class="technology">MySQL</text>
    <text x="776" y="348" class="level">Level 4 / 4</text>
    <text x="776" y="367" class="frequency">Daily</text>
  </g>

  <!-- Row 4 -->
  <g>
    <polygon class="hexagon" fill="url(#weekly)"
      points="437,330 502,367 502,441 437,478 372,441 372,367"/>
    <text x="437" y="390" class="technology">HTML5</text>
    <text x="437" y="413" class="level">Level 4 / 4</text>
    <text x="437" y="432" class="frequency">Occasional</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#weekly)"
      points="663,330 728,367 728,441 663,478 598,441 598,367"/>
    <text x="663" y="390" class="technology">CSS3</text>
    <text x="663" y="413" class="level">Level 3 / 4</text>
    <text x="663" y="432" class="frequency">Several times/week</text>
  </g>

  <!-- Row 5 -->
  <g>
    <polygon class="hexagon" fill="url(#monthly)"
      points="324,395 389,432 389,506 324,543 259,506 259,432"/>
    <text x="324" y="455" class="technology">React</text>
    <text x="324" y="478" class="level">Level 2 / 4</text>
    <text x="324" y="497" class="frequency">Several times/month</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#monthly)"
      points="550,395 615,432 615,506 550,543 485,506 485,432"/>
    <text x="550" y="455" class="technology">JavaScript</text>
    <text x="550" y="478" class="level">Level 1 / 4</text>
    <text x="550" y="497" class="frequency">Several times/month</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#monthly)"
      points="776,395 841,432 841,506 776,543 711,506 711,432"/>
    <text x="776" y="455" class="technology">Node.js</text>
    <text x="776" y="478" class="level">Level 3 / 4</text>
    <text x="776" y="497" class="frequency">Several times/month</text>
  </g>

  <!-- Row 6 -->
  <g>
    <polygon class="hexagon" fill="url(#monthly)"
      points="437,460 502,497 502,571 437,608 372,571 372,497"/>
    <text x="437" y="520" class="technology">Entity Framework</text>
    <text x="437" y="543" class="level">Level 4 / 4</text>
    <text x="437" y="562" class="frequency">Several times/month</text>
  </g>

  <g>
    <polygon class="hexagon" fill="url(#monthly)"
      points="663,460 728,497 728,571 663,608 598,571 598,497"/>
    <text x="663" y="520" class="technology">Express.js</text>
    <text x="663" y="543" class="level">Level 2 / 4</text>
    <text x="663" y="562" class="frequency">Several times/month</text>
  </g>

  <!-- Row 7 -->
  <g>
    <polygon class="hexagon" fill="url(#weekly)"
      points="550,525 615,562 615,636 550,673 485,636 485,562"/>
    <text x="550" y="585" class="technology">REST API</text>
    <text x="550" y="608" class="level">Level 3 / 4</text>
    <text x="550" y="627" class="frequency">Several times/week</text>
  </g>

  <!-- Legend -->
  <text x="550" y="715" text-anchor="middle"
        class="heading" font-size="16">
    USAGE FREQUENCY
  </text>

  <g transform="translate(190,750)">
    <rect width="15" height="15" rx="3" fill="url(#daily)"/>
    <text x="23" y="12" class="legend">Daily</text>
  </g>

  <g transform="translate(355,750)">
    <rect width="15" height="15" rx="3" fill="url(#weekly)"/>
    <text x="23" y="12" class="legend">Several times/week</text>
  </g>

  <g transform="translate(590,750)">
    <rect width="15" height="15" rx="3" fill="url(#monthly)"/>
    <text x="23" y="12" class="legend">Several times/month</text>
  </g>

  <g transform="translate(830,750)">
    <rect width="15" height="15" rx="3" fill="url(#occasional)"/>
    <text x="23" y="12" class="legend">Occasional</text>
  </g>

  <text x="550" y="810" text-anchor="middle"
        class="subtitle" font-size="11">
    Proficiency levels are self-assessed · Levels range from 1 to 4
  </text>

</svg>
